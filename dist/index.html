    <!--
      Applies the stored/system theme before first paint so dark-mode visitors
      never see a white flash. Must stay inline and before the app bundle.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pd-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (t === "dark") {
            document.documentElement.classList.add("white-dark");
            document.documentElement.style.backgroundColor = "#0a0c10";
          }
        } catch (e) {
          /* storage unavailable — fall through to the light default */
        }
      })();
    </script>
